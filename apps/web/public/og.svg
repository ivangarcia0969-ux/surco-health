<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Surco Health">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0fdfa"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="10" fill="url(#teal)"/>
  <!-- emblema -->
  <g transform="translate(110 215)">
    <rect width="200" height="200" rx="44" fill="url(#teal)"/>
    <g fill="#ffffff">
      <rect x="84" y="46" width="32" height="108" rx="9"/>
      <rect x="46" y="84" width="108" height="32" rx="9"/>
    </g>
  </g>
  <!-- texto -->
  <text x="360" y="262" font-family="Arial, sans-serif" font-size="78" font-weight="700" fill="#0f172a">Surco <tspan fill="#0d9488">Health</tspan></text>
  <text x="362" y="318" font-family="Arial, sans-serif" font-size="32" fill="#475569">Historia clínica electrónica, simple y segura</text>
  <g font-family="Arial, sans-serif" font-size="24" fill="#64748b">
    <text x="362" y="392">✓  Agenda y pacientes</text>
    <text x="640" y="392">✓  Odontograma + CIE-10</text>
    <text x="362" y="432">✓  Notas SOAP cifradas</text>
    <text x="640" y="432">✓  Exporta a FHIR R4</text>
  </g>
  <rect x="362" y="488" width="320" height="58" rx="29" fill="url(#teal)"/>
  <text x="522" y="526" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff">Prueba 14 días gratis</text>
  <text x="362" y="588" font-family="Arial, sans-serif" font-size="20" fill="#94a3b8">Habeas Data · Res 1995/1999 · Cifrado at-rest</text>
</svg>
